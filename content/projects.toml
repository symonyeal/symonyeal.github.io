[[project]]
slug = "electricity-pricing"
title = "Electricity Clearing and Pricing"
year = "2026"
subject = "Optimization"
headline = "Compares pricing rules for electricity markets by the side payments each leaves. On a FERC example, convex-hull pricing cuts side payments to generators from $1,690 to $365 with the same dispatch."
problem = "Power plants with start-up costs and minimum outputs cannot be paid by one price per hour, so markets add side payments (uplift) charged back to consumers. How much uplift is paid depends on the pricing rule."
approach = "Exact unit-commitment and pricing models on small systems with DC lines and transfer limits: locational marginal, convex-hull and average-incremental-cost prices, with exact unit hulls and a Lagrangian certificate, and each rule settled. HiGHS solves the linear and mixed-integer programs through a native Rust binding."
results = [
  "FERC staff case: marginal pricing posts $90/MWh at the peak with $1,690 uplift; convex-hull pricing posts $276/MWh with $365.",
  "Outputs on 29 markets are pinned against an independent implementation, including seeded random markets, duration obligations, zero demand and infeasible minimum output.",
]
limits = "Small systems; a research benchmark for price formation, not a market model."
contribution = "Independent project: models, settlement, validation."
tags = ["unit commitment", "convex hull pricing", "mixed-integer programming", "Rust"]
links = [["Repository", "https://github.com/symonyeal/Electricity-Clearing-and-Pricing"]]
source = "README, Background; docs/VALIDATION.md, Cases and Checks (12eb0d2)"

[[project]]
slug = "sparse-portfolio"
title = "Sparse Portfolio Optimization"
year = "2026"
subject = "Optimization"
headline = "Portfolio models that hold at most K stocks, with every solution checked independently on public benchmarks. The investment test waits on licensed CRSP data."
problem = "Does choosing a few stocks by optimization, rather than at random, lower the chance of trailing the market or Treasury bills, given that a few percent of firms account for all net stock-market gains?"
approach = "Six formulations (mean–variance and its perspective reformulation, absolute deviation, CVaR, index tracking, a third-moment model), each solved by HiGHS or SCIP and checked independently: cutting-plane bounds, KKT conditions, recomputation from returns."
results = [
  "On OR-Library data, solver values agree with independent recomputation (CVaR to 4 × 10⁻¹⁷); one frontier comparison misses its 5 × 10⁻¹¹ tolerance and is reported as a failure.",
  "No investment result yet: the test needs CRSP data that includes delisted firms, to avoid survivorship bias.",
]
limits = "OR-Library universes contain survivors only and validate computation, not strategy."
contribution = "Independent project: formulations, certificates and pre-registered test plan."
tags = ["mixed-integer programming", "portfolio optimization", "CVaR", "Rust"]
links = [["Repository", "https://github.com/symonyeal/Sparse-Portfolio-Optimization"]]
source = "README, Models and evidence; docs/results (5b706c1)"

[[project]]
slug = "open-source-watch"
title = "Open-Source Watch"
year = "2026"
subject = "Applied statistics"
headline = "An open-source intelligence monitor for seven conflict and shipping regions, rebuilt after twice-daily collection. A trained text classifier replaced keyword rules (68% against 54% correct), and event linkage in Rust takes 0.06 s against 0.54 s."
problem = "Public reporting on conflicts and shipping arrives from hundreds of feeds of uneven reliability. Which reports describe the same event, and which regional indicators are active, silent or simply missing data?"
approach = "A Rust engine collects 351 configured sources, grades source reliability, classifies each report with TF-IDF and logistic regression, links related reports into incidents and computes regional indicators. A failed feed is reported as a gap, not as inactivity. The front end is based on IRONSIGHT by Nobler Works."
results = [
  "Keyword rules scored 54% on 200 labelled observations; the trained classifier reached 68% under cross-validation and replaced them.",
  "Incident linkage cut unusual-activity flags from 64 to 39 while keeping 11 of the 13 real ones.",
  "A filter for permanent heat sources cut one satellite strike indicator from 228 events to 42.",
]
limits = "Each item is a source’s claim; a reliability grade does not establish its truth. Rare event types remain weak, and 12% of stored texts were never translated."
contribution = "Independent project built on the IRONSIGHT front end: engine, collection, classification, linkage and validation."
tags = ["text classification", "record linkage", "open-source intelligence", "Rust", "TypeScript"]
links = [["Dashboard", "https://symonyeal.github.io/Open-Source-Watch/"], ["Repository", "https://github.com/symonyeal/Open-Source-Watch"], ["IRONSIGHT", "https://github.com/NoblerWorks-HQ/IRONSIGHT"]]
source = "README, introduction, Coverage, linkage and Validation (91c33b2)"

