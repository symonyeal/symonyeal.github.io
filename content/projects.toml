# One [[project]] per repository, in display order. Every number is copied from the
# repository's README or site; each entry names where it came from in `source`.
#
# Fields
#   slug        anchor id
#   subject     one of SUBJECTS in build.py
#   headline    the card text: what it is and what it found, in plain words
#   problem, approach, results, limits   the write-up (not shown on the site; the source for headline)
#   contribution  what the author did
#   links       [label, url] pairs; the first is the primary action

[[project]]
slug = "electric-fleet"
title = "Electric Fleet Optimization"
year = "2026"
subject = "Optimization"
headline = "Plans electric-vehicle routes with charging stops and proves how far each plan can be from optimal. Four benchmark instances are solved to proven optimality; on three of them the optimum is shorter than the published value."
problem = "Electric vans and buses have limited range, so a plan must decide when and where each vehicle recharges as well as where it goes. The IEEE WCCI-2020 benchmark for electric-vehicle routing published values as upper bounds that were never verified optimal, and later heuristics report no lower bounds."
approach = "A mixed-integer model on a station-path multigraph, bounded by a set-partitioning linear program solved by column generation with rounded capacity cuts; the Lagrangian bound is valid at every exact pricing. Every reported plan is replayed and every bound comes from an admitted result bundle, so each instance is labelled certified or bracketed. The same code schedules and charges TransLink’s Route 100 timetable (219 trips a day)."
results = [
  "E-n22-k4, E-n23-k3, E-n30-k3 and E-n33-k4 certified optimal. On E-n33-k4 the optimum, 840.15, is shorter than the published 869.89.",
  "E-n51-k5, E-n76-k7 and E-n101-k8 are bracketed, with gaps of 24.6% to 33.0%.",
  "Route 100: ignoring battery limits, 16 buses cover the timetable. With 250 kWh batteries, the best full-day schedule found uses 22 buses, with a 38.4% gap to its lower bound.",
]
limits = "One depot, identical vehicles, no time windows or driver shifts. Three of the seven benchmark instances remain bracketed, and the full-day battery schedule is not proved optimal. It is not TransLink’s operating plan."
contribution = "Independent project: formulation, algorithms, validation and documentation."
tags = ["mixed-integer programming", "column generation", "Lagrangian bounds", "Rust"]
links = [["Repository", "https://github.com/symonyeal/Electric-Fleet-Optimization"]]
source = "README, Results table (revision 8f07c5c); docs/results/README.md, Route 100"

[[project]]
slug = "supply-chain-cuts"
title = "Supply Chain Cuts"
year = "2026"
subject = "Optimization"
headline = "Which losses of one country’s output would cut world battery or solar production by a quarter? If plants can switch battery chemistry, lithium-ion supply has five, all in China."
problem = "Batteries and solar panels pass through mines, refineries and factories in many countries. Which losses of one country’s output, alone or with up to two others, would cut world production by at least 25% over 24 months, and how often might that happen?"
approach = "A capacity network from mine to cell, built from 2024 production statistics and, where those are missing, export mass. A recourse linear program gives the least shortfall under each disruption. Minimal cut sets of up to three losses are enumerated three ways that share no code (an interdiction MILP built from the LP dual, a lattice search pruned by capacity dominance, exhaustive search), and their lists agree. Annual probability is bracketed by an exact lower bound plus a Monte Carlo residual."
results = [
  "Batteries: five single weak points (cells, cathode material, anode material, graphite, lithium carbonate), assuming plants can switch between LFP and NCM chemistries; the fixed 50/50 mix has seven.",
  "Solar: four single weak points (polysilicon, wafers, cells, modules).",
  "If every export restriction recorded since 2012 were a complete shutdown, such a shortfall would occur in about 29% of years for batteries and 24% for solar. These are conditional scenarios, not forecasts.",
]
limits = "Much capacity outside China is estimated from export volumes. Actual plant switchability is unmeasured. Recorded export restrictions fail the predictive test."
contribution = "Independent project: model, enumeration methods, data reconciliation, validation and interactive site."
tags = ["network interdiction", "linear programming", "Monte Carlo", "supply-chain risk", "Python", "Rust"]
links = [["Interactive site", "https://symonyeal.github.io/Supply-Chain-Cuts/"], ["Repository", "https://github.com/symonyeal/Supply-Chain-Cuts"]]
source = "README, Main findings and Updated model results (718104f)"

[[project]]
slug = "supplier-panels"
title = "Resilient Supplier Panels"
year = "2026"
subject = "Optimization"
headline = "Picks USDA food suppliers so that every product is still covered if any one supplier fails. In 30 of 40 sampled baskets no such choice exists, because one product has a single approved supplier."
problem = "The USDA approves vendors for specific products before they may bid on its food purchases. A buyer wants a panel of suppliers that still covers every product in a basket after any one supplier fails. How small can it be, how many exist, and which suppliers cannot be replaced?"
approach = "Resilient panels are the minimal transversals of a scenario hypergraph. Branch and bound finds a smallest panel exactly (median 2 µs). Berge’s method and FK-B, from the author’s MSc thesis, and MMCS enumerate every minimal panel; a counting theorem counts them without listing. Separate code checks every panel against the USDA list, and an exhaustive search checks that the enumeration is complete."
results = [
  "30 of 40 baskets have no resilient panel; each contains a product with only one approved supplier. Approving a second supplier, not choosing differently, fixes it.",
  "In the other 10 baskets, 2 to 6 suppliers cover every product after any single failure.",
  "Canned-goods example: 21 approved suppliers, a smallest panel of 2, and 1,284 minimal panels.",
]
limits = "Approvals only: not capacity, price or delivery record. The 40-basket result uses one data snapshot (2026-10-15). Research, not a purchasing recommendation."
contribution = "Independent project: model, solver and enumeration pipeline, checks and interactive site."
tags = ["hypergraph transversals", "integer programming", "enumeration", "Rust"]
links = [["Interactive site", "https://symonyeal.github.io/Resilient-Supplier-Panels/"], ["Repository", "https://github.com/symonyeal/Resilient-Supplier-Panels"], ["Releases", "https://github.com/symonyeal/Resilient-Supplier-Panels/releases"]]
source = "README, short answer, three examples, Validation and benchmark note (f5280d6)"

[[project]]
slug = "hypergraph-dualization"
title = "Hypergraph Dualization (MSc thesis)"
year = "2023–2024"
subject = "Discrete mathematics"
headline = "My MSc thesis on symmetry in hypergraph dualization, with corrected statements formalized in Lean. On alternating-tree inputs, FK-A has an exponential recursion tree while a suitable memoized split rule uses linearly many subproblems."
problem = "Given two hypergraphs, decide whether each is the transversal hypergraph of the other: list every minimal way to meet all of a family of sets, and prove the list complete. Whether this can be done in polynomial time is open. Fredman and Khachiyan’s algorithms FK-A and FK-B run in quasi-polynomial time, but FK-A slows on highly symmetric families."
approach = "The thesis studies symmetry in hypergraphs and their transversals. The maintained repository implements FK-A and FK-B on one bitset model, checks their answers against an independent transversal oracle, and formalizes audited thesis statements and corrections in Lean 4 with Mathlib."
results = [
  "Lean proofs distinguish exponential recursion-tree growth from a linear bound on distinct subproblems under the leftmost rule on the alternating trees.",
  "The claim register separates proved results, finite checks, computations, cited results and open conjectures; the revised thesis applies the audited corrections.",
  "The frequency bound ε(7) = 3/7 is proved, attained by the Fano plane.",
]
limits = "Whether dualization is solvable in polynomial time remains open. The growth of the degree-sum rule’s distinct subproblems is also open; finite computations do not establish an asymptotic bound."
contribution = "MSc thesis, Simon Fraser University, 2024 (senior supervisor: Tamon Stephen). The maintained Python implementation; the legacy implementation credits Saimon Islam and Lacey Liang."
tags = ["hypergraphs", "monotone Boolean functions", "automorphism groups", "Lean", "Python"]
links = [["Revised thesis (PDF)", "https://github.com/symonyeal/Hypergraph-Dualization/blob/main/thesis/revised/main.pdf"], ["Repository", "https://github.com/symonyeal/Hypergraph-Dualization"]]
source = "Hypergraph-Dualization README and thesis/CLAIMS.md at c1e49a1, rechecked at e5479ac; research Theorems 4.24–4.26 and ε(7)"

[[project]]
slug = "metabolic-cut-sets"
title = "Minimal Metabolic Interventions"
year = "2026"
subject = "Discrete mathematics"
headline = "Computes minimal cut sets of E. coli metabolic networks from their 100,274 elementary modes in exact integer arithmetic, and measures where the MMCS search spends its nodes: most lie in dead subtrees, not repeated states."
problem = "A minimal cut set of a metabolic network is a set of reactions whose removal blocks a target function, such as growth or ethanol export, and contains no smaller blocking set. Given the elementary modes carrying the target, the cut sets are the minimal hitting sets of their supports: a hypergraph dualization problem, usually solved by MMCS."
approach = "Elementary modes of a BiGG model are enumerated in exact integer arithmetic; MMCS enumerates the minimal hitting sets with static twins merged; every enumerated family is checked against at least one independent enumerator (brute force, Berge, SHD or an LP cut oracle)."
results = [
  "BiGG e_coli_core: the 100,274 elementary modes are reproduced.",
  "Dead subtrees hold 26% to 79% of search nodes across six instances (79.3% on the 38,391-node combined-growth search).",
  "Reusing isomorphic states could save at most 7.1 percentage points beyond exact repeats, below the predeclared 1/6 threshold, so the study stopped there.",
]
limits = "Two reconstructions of one organism; no claim across organisms. Times are laptop measurements."
contribution = "Independent project: enumeration code, independent checks and the search-node census."
tags = ["hypergraph dualization", "metabolic networks", "exact arithmetic", "Rust"]
links = [["Repository", "https://github.com/symonyeal/Minimal-Metabolic-Interventions"]]
source = "README, Background, Result and Limits (8ce45c4)"

[[project]]
slug = "mma-rankings"
title = "MMA Career Rankings"
year = "2026"
subject = "Applied statistics"
headline = "Era-adjusted ratings for 34,150 fighters, fitted to 81,643 professional fights and ranked by career, peak and current form."
problem = "Ranking fighters across three decades and many promotions: rating scales drift upward over time, promotions differ in depth, and a short unbeaten record can look better than a long elite career."
approach = "Whole-History Rating (Coulom, 2008) fitted to every career at once, so later results revalue earlier wins. Promotion weights are kept out of the rating and pulled toward the average where evidence is thin. The model is written in Rust; source acquisition and staging are in Python."
results = [
  "81,643 rated fights and 34,150 rated fighters; whole-career coverage for 1,827 of 1,840 eligible fighters (99.3%).",
  "Published All-time and Prime boards for men and women, with Current and weight-class boards for UFC fighters.",
  "The site lets a reader filter boards by roster, weight class, board size and minimum rated bouts, and overlay fighters’ career arcs.",
]
limits = "Not yet shown to predict fights better than a simpler rating; that test is open. Promotion labels are missing from 54% of rated fights."
contribution = "Independent project: rating model, data assembly, release checks and interactive site."
tags = ["rating systems", "Bayesian inference", "paired comparison", "data visualization", "Rust", "Python"]
links = [["Interactive site", "https://symonyeal.github.io/MMA-Career-Rankings/"], ["Repository", "https://github.com/symonyeal/MMA-Career-Rankings"]]
source = "README, Rankings, Rating model, release facts and Structure (d0b365e)"

