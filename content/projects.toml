[[project]]
slug = "electricity-pricing"
title = "Electricity Clearing and Pricing"
year = "2026"
subject = "Optimization"
headline = "On a FERC two-unit example, convex-hull pricing cuts out-of-market side payments by 78% with the same dispatch."
problem = "Power plants with start-up costs and minimum outputs cannot be paid by one price per hour, so markets add side payments (uplift) charged back to consumers. How much uplift is paid depends on the pricing rule."
approach = "Exact unit-commitment and pricing models on small systems: locational marginal, convex-hull and average-incremental-cost prices, with the hull computed two ways and by Dantzig–Wolfe column generation, checked against each other and against published cases."
results = [
  "FERC staff case: marginal pricing posts $90/MWh at the peak with $1,690 uplift; convex-hull pricing posts $276/MWh with $365.",
  "The two hull constructions agree to 2.6 × 10⁻¹⁶ on 104 feasible random systems; omitting congestion gives a wrong bound with no warning.",
  "A 1 MW, 4 MWh battery in New York City in 2025 would have netted about $41,000, 22% of the perfect-foresight $190,720 (archived output, not re-run).",
]
limits = "Small systems; compares pricing rules, does not run a market."
contribution = "Independent project: models, decomposition, settlement checks."
tags = ["unit commitment", "convex hull pricing", "Dantzig–Wolfe", "energy storage", "Python"]
image_alt = "Line chart: cumulative net settlement of a 1 MW, 4 MWh battery in New York City through 2025 under no trading, deterministic forecast, risk-neutral, CVaR and perfect-foresight policies."
caption = "Battery settlement in 2025 under five policies (archived output, revision 88d244d)."
links = [["Repository", "https://github.com/symonyeal/Electricity-Clearing-and-Pricing"]]
source = "README, In plain terms and What it shows"

[[project]]
slug = "sparse-portfolio"
title = "Sparse Portfolio Optimization"
year = "2026"
subject = "Optimization"
headline = "Cardinality-constrained portfolio models built and certified on public benchmarks; the empirical test awaits a licensed database."
problem = "Does choosing a few stocks by optimization, rather than at random, lower the chance of trailing the market or Treasury bills, given that a few percent of firms account for all net stock-market gains?"
approach = "Six formulations (mean–variance and its perspective reformulation, absolute deviation, CVaR, index tracking, a third-moment model), each solved by an open-source solver and checked independently: cutting-plane bounds, KKT conditions, recomputation from returns."
results = [
  "On OR-Library data, solver values agree with independent recomputation (CVaR to 4 × 10⁻¹⁷); one frontier comparison misses its 5 × 10⁻¹¹ tolerance and is reported as a failure.",
  "No investment result yet: the test needs CRSP data that includes delisted firms, to avoid survivorship bias.",
]
limits = "OR-Library universes contain survivors only and validate computation, not strategy."
contribution = "Independent project: formulations, certificates and pre-registered test plan."
tags = ["mixed-integer programming", "portfolio optimization", "CVaR", "Python"]
formula = "min λ wᵀΣw − (1 − λ) μᵀw  s.t.  1ᵀw = 1,  εᵢzᵢ ≤ wᵢ ≤ δᵢzᵢ,  1ᵀz = K,  z ∈ {0,1}ᴺ"
caption = "F1: mean–variance with at most K holdings (Chang et al., 2000)."
links = [["Repository", "https://github.com/symonyeal/Sparse-Portfolio-Optimization"]]
source = "README, Status; docs/MODEL.md §3; docs/results"

